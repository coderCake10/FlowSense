events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Upstream definitions matching your docker-compose service names
    upstream django_backend {
        server backend:8000;
    }

    upstream swagger_docs {
        server swagger-ui:8080;
    }

    server {
        listen 80;
        server_name localhost; 

        # 1. Route API Traffic to Django
        location /api/ {
            proxy_pass http://django_backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Route Admin Panel to Django
        location /admin/ {
            proxy_pass http://django_backend/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Route Documentation Traffic to Swagger UI
        location /docs/ {
            proxy_pass http://swagger_docs/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 4. Django Static Files (Required for the Admin panel to look correct)
        location /static/ {
            alias /app/static/; 
        }
        
        location /media/ {
            alias /app/media/;
        }
    }
}