services:
  swagger-ui:
    image: swaggerapi/swagger-ui
    container_name: flowsense-swagger
    restart: unless-stopped
    environment:
      - SWAGGER_JSON=/spec/flowsense-openapi.yaml
    volumes:
      - ./docs/openapi:/spec:ro
    ports:
      - "8080:8080"

  # Uncomment as needed

  mosquitto: # MQTT
    image: eclipse-mosquitto:latest
    container_name: flowsense_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./backend/mosquitto/config:/mosquitto/config
      - ./backend/mosquitto/data:/mosquitto/data

  db: # PostgreSQL / PostGIS
    image: postgis/postgis:16-3.4
    container_name: flowsense-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: flowsense
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend: # Django / DRF
    build:
      context: .
      dockerfile: ./docker/Dockerfile.django
    container_name: flowsense-backend
    command: python manage.py runserver 0.0.0.0:8000
    restart: unless-stopped
    env_file: .env
    environment:
      - POSTGRES_DB=flowsense
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      # Shared cache so sign-in rate limits hold across backend processes.
      - REDIS_CACHE_URL=redis://redis:6379/1
    volumes:
      - ./backend/django:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend: 
    build:
      context: .
      dockerfile: ./docker/Dockerfile.frontend
    container_name: flowsense-frontend
    restart: unless-stopped
    environment:
      - VITE_HMR_CLIENT_PORT=80
      - CHOKIDAR_USEPOLLING=true
      # nginx routes /api to Django on the same origin.
      - VITE_API_BASE_URL=/api/v1
      # When the frontend is opened directly on :3000, Vite forwards /api to
      # the backend container (127.0.0.1 would be this container itself).
      - VITE_API_PROXY_TARGET=http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      # Kiosk models are committed in frontend/client/public/models. Point
      # FLOWSENSE_MODELS_DIR at another folder to serve different ones
      # (see docs/setup/building-models.md).
      - ${FLOWSENSE_MODELS_DIR:-./frontend/client/public/models}:/app/client/public/models:ro
    ports:
      - "3000:3000"

  mqtt-consumer:  
    build:
      context: .
      dockerfile: ./docker/Dockerfile.django
    container_name: flowsense-mqtt-consumer
    restart: unless-stopped
    command: python manage.py run_mqtt_consumer
    volumes:
      - ./backend/django:/app
    depends_on:
      - db
      - mosquitto
    env_file: .env
    environment:
      - POSTGRES_DB=flowsense
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - MQTT_HOST=mosquitto
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASSWORD=${MQTT_PASSWORD}

  redis:
    image: redis:7-alpine
    container_name: flowsense_redis  
    command: redis-server --appendonly yes
    restart: unless-stopped
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery-worker:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.django
    container_name: flowsense-celery-worker
    command: celery -A config worker -l info
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=${DB_URL}
      - POSTGRES_DB=flowsense
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./backend/django:/app
    depends_on:
      - redis
      - db

  celery-beat:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.django
    container_name: flowsense-celery-beat
    command: celery -A config beat -l info
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=${DB_URL}
      - POSTGRES_DB=flowsense
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./backend/django:/app
    depends_on:
      - redis
      - db

  nginx: # Reverse Proxy
    image: nginx:alpine
    container_name: flowsense_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./backend/django/static:/app/static:ro
    depends_on:
      - backend
      - swagger-ui
      - frontend

volumes:
  pgdata:
  redisdata:
  frontend_node_modules: