openapi: 3.0.3
info:
  title: FlowSense API
  description: >
    REST API for FlowSense, an indoor/outdoor campus wayfinding system for AUF.
    Serves three clients (Kiosk, Mobile Companion, Admin Dashboard) via a
    versioned, feature-based, role-aware API. Public endpoints (map, navigation,
    search, sessions) require no authentication; administrative endpoints
    (annotation, hardware, assets, analytics, users, settings) require an
    authenticated admin session. ESP32 sensors never call this REST API —
    they publish exclusively over MQTT.
  version: "1.0.0"
servers:
  - url: /api/v1
    description: Versioned API root

tags:
  - name: Authentication
    description: Passwordless administrator authentication
  - name: Map
    description: Static campus spatial data (buildings, floors, rooms, nodes)
  - name: Navigation
    description: Route calculation and retrieval
  - name: Search
    description: Destination and personnel search
  - name: Navigation Sessions
    description: Kiosk-side multi-destination navigation session lifecycle
  - name: QR Sessions
    description: QR-code based mobile handoff sessions
  - name: Kiosk Sessions
    description: Kiosk interaction session lifecycle
  - name: Annotation
    description: CRUD for map annotations, nodes, edges, and transitions
  - name: Hardware
    description: Device registry for kiosks and ESP32 sensors
  - name: Assets
    description: 3D building model asset upload, versioning, and validation
  - name: Analytics
    description: Dashboard statistics and generated reports
  - name: Alerts
    description: System and operational alerts
  - name: Activity
    description: Administrative audit trail
  - name: Users
    description: Administrator account management
  - name: Settings
    description: Site-wide configuration and academic semesters
  - name: System
    description: System health and status

security:
  - AdminSessionCookie: []

paths:
  # ------------------------------------------------------------------
  # AUTHENTICATION
  # ------------------------------------------------------------------
  /auth/login:
    post:
      tags: [Authentication]
      summary: Initiate passwordless authentication
      description: Initiates passwordless authentication flow by sending an OTP and/or login link to the administrator's institutional email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Challenge created and delivered via email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/verify:
    post:
      tags: [Authentication]
      summary: Verify OTP or login link
      description: Verifies the provided OTP code or login link token and establishes an admin session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_id]
              properties:
                challenge_id:
                  type: integer
                  format: int64
                otp_code:
                  type: string
                login_token:
                  type: string
      responses:
        "200":
          description: Session established
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Log out
      description: Invalidates the current authenticated admin session.
      responses:
        "200":
          $ref: "#/components/responses/SuccessNoData"

  /auth/me:
    get:
      tags: [Authentication]
      summary: Get current administrator
      description: Retrieves the profile, role, and identity of the currently logged-in administrator.
      responses:
        "200":
          description: Current administrator profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AdminUser"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/session:
    get:
      tags: [Authentication]
      summary: Check session status
      description: Checks the status and validity of the current admin session.
      responses:
        "200":
          description: Session status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/AdminSession"

  # ------------------------------------------------------------------
  # MAP
  # ------------------------------------------------------------------
  /map/context:
    get:
      tags: [Map]
      summary: Get campus spatial context
      description: Retrieves overall campus spatial context and coordinate configuration.
      security: []
      responses:
        "200":
          description: Campus spatial context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  /map/areas:
    get:
      tags: [Map]
      summary: List areas
      description: Retrieves a list of all configured buildings and areas.
      security: []
      parameters:
        - $ref: "#/components/parameters/AreaTypeFilter"
      responses:
        "200":
          description: List of areas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaListResponse"
    post:
      tags: [Map]
      summary: Create area
      description: Creates a new building or campus area entity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AreaInput"
      responses:
        "201":
          description: Area created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"

  /map/areas/{id}:
    get:
      tags: [Map]
      summary: Get area
      description: Retrieves metadata and configuration details for a specific building/area.
      security: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Area detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Map]
      summary: Update area
      description: Updates metadata for a specific building/area.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AreaInput"
      responses:
        "200":
          description: Area updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreaResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Map]
      summary: Delete area
      description: Removes a specific building/area from the system.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          $ref: "#/components/responses/SuccessNoData"
        "404":
          $ref: "#/components/responses/NotFound"

  /map/areas/{id}/floors:
    get:
      tags: [Map]
      summary: List floors for area
      description: Retrieves all floors associated with a specific building/area.
      security: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: List of floors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FloorListResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /map/floors/{id}:
    get:
      tags: [Map]
      summary: Get floor
      description: Retrieves metadata and elevation details for a specific floor.
      security: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Floor detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FloorResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /map/rooms:
    get:
      tags: [Map]
      summary: List rooms
      description: Retrieves a list of all mapped rooms.
      security: []
      parameters:
        - $ref: "#/components/parameters/FloorIdFilter"
        - $ref: "#/components/parameters/AreaIdFilter"
        - name: room_type
          in: query
          schema:
            $ref: "#/components/schemas/RoomType"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: List of rooms
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomListResponse"

  /map/rooms/{id}:
    get:
      tags: [Map]
      summary: Get room
      description: Retrieves details for a specific room.
      security: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Room detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /map/rooms/{id}/personnel:
    get:
      tags: [Map]
      summary: Get personnel assigned to a room
      description: Retrieves the specific personnel assigned to work within a specific room.
      security: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: List of personnel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonnelListResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /map/entrances:
    get:
      tags: [Map]
      summary: List entrances
      description: Retrieves a list of all defined building or area entrances.
      security: []
      parameters:
        - $ref: "#/components/parameters/AreaIdFilter"
      responses:
        "200":
          description: List of entrances
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntranceListResponse"

  /map/stairs:
    get:
      tags: [Map]
      summary: List stairs
      description: Retrieves a list of all mapped stairwells.
      security: []
      parameters:
        - $ref: "#/components/parameters/AreaIdFilter"
      responses:
        "200":
          description: List of stairs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StairListResponse"

  /map/elevators:
    get:
      tags: [Map]
      summary: List elevators
      description: Retrieves a list of all mapped elevators.
      security: []
      parameters:
        - $ref: "#/components/parameters/AreaIdFilter"
      responses:
        "200":
          description: List of elevators
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElevatorListResponse"

  /map/outdoor-walkways:
    get:
      tags: [Map]
      summary: List outdoor walkways
      description: Retrieves a list of all mapped outdoor walkways.
      security: []
      parameters:
        - $ref: "#/components/parameters/AreaIdFilter"
      responses:
        "200":
          description: List of outdoor walkways
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutdoorWalkwayListResponse"

  /map/personnel:
    get:
      tags: [Map]
      summary: List personnel
      description: Retrieves a list of all personnel registered within the spatial system.
      security: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: List of personnel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonnelListResponse"

  # ------------------------------------------------------------------
  # NAVIGATION
  # ------------------------------------------------------------------
  /navigation/routes:
    post:
      tags: [Navigation]
      summary: Calculate a route
      description: Calculates and returns an optimal route path (A*, Manhattan-distance heuristic) based on provided starting and ending nodes. Supports single or multi-destination queues.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [origin_node_id, destination_node_ids]
              properties:
                origin_node_id:
                  type: integer
                  format: int64
                destination_node_ids:
                  type: array
                  items:
                    type: integer
                    format: int64
                  minItems: 1
                navigation_session_id:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Route generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteResponse"
        "422":
          description: No valid route could be generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /navigation/routes/{id}:
    get:
      tags: [Navigation]
      summary: Get route
      description: Retrieves the specific details and segment geometry of a previously generated route.
      security: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Route detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /navigation/nodes/{id}:
    get:
      tags: [Navigation]
      summary: Get navigation node
      description: Retrieves the spatial coordinates and metadata for a specific navigation node.
      security: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Node detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NavigationNodeResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /navigation/destinations/{id}:
    get:
      tags: [Navigation]
      summary: Get navigable destination
      description: Retrieves details for a specific navigable location used in routing.
      security: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Destination detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NavigationNodeResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  # ------------------------------------------------------------------
  # SEARCH
  # ------------------------------------------------------------------
  /search:
    get:
      tags: [Search]
      summary: Search destinations
      description: Executes a query to find rooms, aliases, or personnel matching the user's input.
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: kiosk_session_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResultsResponse"

  /search/suggestions:
    get:
      tags: [Search]
      summary: Get search suggestions
      description: Provides autocomplete or fuzzy-matched suggestions as the user types in the kiosk search bar.
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Suggestion list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: string

  # ------------------------------------------------------------------
  # NAVIGATION SESSIONS
  # ------------------------------------------------------------------
  /sessions/navigation:
    post:
      tags: [Navigation Sessions]
      summary: Initialize navigation session
      description: Initializes a new navigation session for a route or multi-destination queue.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kiosk_session_id:
                  type: string
                  format: uuid
                destination_node_ids:
                  type: array
                  items:
                    type: integer
                    format: int64
      responses:
        "201":
          description: Navigation session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NavigationSessionResponse"

  /sessions/navigation/{id}:
    get:
      tags: [Navigation Sessions]
      summary: Get navigation session
      description: Retrieves the current status, instructions, and checklist of an active navigation session.
      security: []
      parameters:
        - $ref: "#/components/parameters/UuidIdPath"
      responses:
        "200":
          description: Navigation session detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NavigationSessionResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/navigation/{id}/pause:
    post:
      tags: [Navigation Sessions]
      summary: Pause navigation session
      description: Pauses an active navigation session.
      security: []
      parameters:
        - $ref: "#/components/parameters/UuidIdPath"
      responses:
        "200":
          description: Navigation session paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NavigationSessionResponse"

  /sessions/navigation/{id}/resume:
    post:
      tags: [Navigation Sessions]
      summary: Resume navigation session
      description: Resumes a previously paused navigation session.
      security: []
      parameters:
        - $ref: "#/components/parameters/UuidIdPath"
      responses:
        "200":
          description: Navigation session resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NavigationSessionResponse"

  /sessions/navigation/{id}/complete:
    post:
      tags: [Navigation Sessions]
      summary: Complete navigation session
      description: Marks a navigation session as successfully concluded.
      security: []
      parameters:
        - $ref: "#/components/parameters/UuidIdPath"
      responses:
        "200":
          description: Navigation session completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NavigationSessionResponse"

  /sessions/navigation/{id}/cancel:
    post:
      tags: [Navigation Sessions]
      summary: Cancel navigation session
      description: Aborts a navigation session entirely.
      security: []
      parameters:
        - $ref: "#/components/parameters/UuidIdPath"
      responses:
        "200":
          description: Navigation session cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NavigationSessionResponse"

  /sessions/{id}/destinations/{destination_id}/reach:
    post:
      tags: [Navigation Sessions]
      summary: Mark destination reached
      description: Triggers a dynamic update confirming that a specific destination in the checklist has been reached via BLE proximity or manual user input.
      security: []
      parameters:
        - $ref: "#/components/parameters/UuidIdPath"
        - name: destination_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Destination marked as reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NavigationDestinationResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  # ------------------------------------------------------------------
  # QR SESSIONS
  # ------------------------------------------------------------------
  /sessions:
    post:
      tags: [QR Sessions]
      summary: Create QR handoff session
      description: Generates a new temporary session tied to a QR code for mobile handoff.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                navigation_session_id:
                  type: string
                  format: uuid
      responses:
        "201":
          description: QR session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NavigationSessionResponse"

  /sessions/{id}:
    get:
      tags: [QR Sessions]
      summary: Get QR session
      description: Retrieves the details of a specific QR handoff session.
      security: []
      parameters:
        - $ref: "#/components/parameters/UuidIdPath"
      responses:
        "200":
          description: QR session detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NavigationSessionResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{id}/scan:
    post:
      tags: [QR Sessions]
      summary: Register QR scan
      description: Registers that a mobile device has scanned the QR code, officially initiating the handoff.
      security: []
      parameters:
        - $ref: "#/components/parameters/UuidIdPath"
      responses:
        "200":
          description: QR session marked as scanned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NavigationSessionResponse"

  /sessions/{id}/complete:
    post:
      tags: [QR Sessions]
      summary: Complete QR handoff
      description: Marks the QR handoff process as fully completed.
      security: []
      parameters:
        - $ref: "#/components/parameters/UuidIdPath"
      responses:
        "200":
          description: QR session completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NavigationSessionResponse"

  /sessions/{id}/cancel:
    post:
      tags: [QR Sessions]
      summary: Cancel QR handoff
      description: Cancels an unfulfilled QR session, typically due to idle timeout.
      security: []
      parameters:
        - $ref: "#/components/parameters/UuidIdPath"
      responses:
        "200":
          description: QR session cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NavigationSessionResponse"

  # ------------------------------------------------------------------
  # KIOSK SESSIONS
  # ------------------------------------------------------------------
  /sessions/kiosk:
    post:
      tags: [Kiosk Sessions]
      summary: Initialize kiosk session
      description: Initializes a new active interaction session when a user begins interacting with the kiosk.
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                kiosk_id:
                  type: integer
                  format: int64
      responses:
        "201":
          description: Kiosk session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KioskSessionResponse"

  /sessions/kiosk/{id}:
    get:
      tags: [Kiosk Sessions]
      summary: Get kiosk session
      description: Retrieves details about a specific active kiosk interaction session.
      security: []
      parameters:
        - $ref: "#/components/parameters/UuidIdPath"
      responses:
        "200":
          description: Kiosk session detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KioskSessionResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/kiosk/{id}/heartbeat:
    post:
      tags: [Kiosk Sessions]
      summary: Kiosk session heartbeat
      description: Receives periodic pings from the kiosk to keep the session alive and prevent idle timeouts.
      security: []
      parameters:
        - $ref: "#/components/parameters/UuidIdPath"
      responses:
        "200":
          $ref: "#/components/responses/SuccessNoData"

  /sessions/kiosk/{id}/end:
    post:
      tags: [Kiosk Sessions]
      summary: End kiosk session
      description: Terminates the session due to a timeout or user action, forcing the UI to return to the Attract Screen.
      security: []
      parameters:
        - $ref: "#/components/parameters/UuidIdPath"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                end_reason:
                  $ref: "#/components/schemas/KioskSessionEndReason"
      responses:
        "200":
          description: Kiosk session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KioskSessionResponse"

  # ------------------------------------------------------------------
  # ANNOTATION
  # ------------------------------------------------------------------
  /annotations:
    get:
      tags: [Annotation]
      summary: Get all annotations
      description: Retrieves all current map annotations, logical objects, and routes for rendering in the admin 3D editor.
      parameters:
        - $ref: "#/components/parameters/AreaIdFilter"
        - $ref: "#/components/parameters/FloorIdFilter"
      responses:
        "200":
          description: Full annotation set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnotationBundleResponse"

  /annotations/nodes/{id}:
    post:
      tags: [Annotation]
      summary: Create annotation node
      description: Creates a new annotation node (Room, Entrance, Kiosk, Sensor, or Auxiliary).
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NavigationNodeInput"
      responses:
        "201":
          description: Node created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NavigationNodeResponse"
    get:
      tags: [Annotation]
      summary: Get annotation node
      description: Retrieves data and contextual configuration for a specific annotation node.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Node detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NavigationNodeResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Annotation]
      summary: Delete annotation node
      description: Deletes a node and cascades to safely remove all edges connected to it.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          $ref: "#/components/responses/SuccessNoData"
        "404":
          $ref: "#/components/responses/NotFound"

  /annotations/edges:
    post:
      tags: [Annotation]
      summary: Create edge
      description: Creates a new pathfinding edge/connection between two existing auxiliary nodes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
