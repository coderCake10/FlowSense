  # ------------------------------------------------------------------
  # ASSETS
  # ------------------------------------------------------------------
  /assets:
    get:
      tags: [Assets]
      summary: List assets
      description: Retrieves a summarized overview of all uploaded system assets.
      parameters:
        - $ref: "#/components/parameters/AreaIdFilter"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: List of assets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetListResponse"
    post:
      tags: [Assets]
      summary: Upload new asset
      description: Handles the secure file upload for a new asset.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, name]
              properties:
                file:
                  type: string
                  format: binary
                name:
                  type: string
                area_id:
                  type: integer
                  format: int64
                description:
                  type: string
                source:
                  type: string
                notes:
                  type: string
      responses:
        "201":
          description: Asset created and queued for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetResponse"

  /assets/{id}:
    get:
      tags: [Assets]
      summary: Get asset
      description: Retrieves the metadata, processing status, and validation status of a specific asset.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Asset detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Assets]
      summary: Update asset metadata
      description: Modifies asset metadata like Name, Description, Source, or Notes.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetUpdateInput"
      responses:
        "200":
          description: Asset updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Assets]
      summary: Delete asset
      description: Deletes an asset from the system.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          $ref: "#/components/responses/SuccessNoData"
        "404":
          $ref: "#/components/responses/NotFound"

  /assets/{id}/versions:
    get:
      tags: [Assets]
      summary: List asset versions
      description: Retrieves a chronological history of uploads/versions for a specific asset.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: List of asset versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetVersionListResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Assets]
      summary: Upload new asset version
      description: Uploads a new file to replace the current asset as a new version.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: New version created and queued for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetVersionResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /assets/{id}/versions/{version_id}:
    get:
      tags: [Assets]
      summary: Get asset version
      description: Retrieves detailed file information regarding a specific asset version.
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/VersionIdPath"
      responses:
        "200":
          description: Asset version detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetVersionResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /assets/{id}/versions/{version_id}/download:
    get:
      tags: [Assets]
      summary: Download asset version file
      description: Dispatches the file download for a specific .glb asset version.
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/VersionIdPath"
      responses:
        "200":
          description: Binary .glb file stream
          content:
            model/gltf-binary:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"

  /assets/{id}/validation:
    get:
      tags: [Assets]
      summary: Get overall asset validation status
      description: Retrieves the overall pass, warning, and error validation status for an asset.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Validation status summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationRunListResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /assets/{id}/versions/{version_id}/validation:
    get:
      tags: [Assets]
      summary: Get version validation history
      description: Retrieves the historical validation results for a specific version.
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/VersionIdPath"
      responses:
        "200":
          description: Validation run history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationRunListResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Assets]
      summary: Trigger validation run
      description: Manually triggers the backend to run validation checks against the asset version.
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/VersionIdPath"
      responses:
        "202":
          description: Validation run queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationRunResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /assets/{id}/versions/{version_id}/validation/checks:
    get:
      tags: [Assets]
      summary: Get validation checks
      description: Retrieves the specific structural, geometric, and compatibility checks performed during validation.
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/VersionIdPath"
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/ValidationCategory"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ValidationStatus"
      responses:
        "200":
          description: List of validation checks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationCheckListResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /assets/{id}/processing:
    get:
      tags: [Assets]
      summary: Get asset processing status
      description: Checks if background tasks (like Draco compression or parsing) are complete.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Processing status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          processing_status:
                            $ref: "#/components/schemas/ProcessingStatus"
        "404":
          $ref: "#/components/responses/NotFound"

  /assets/{id}/activate:
    post:
      tags: [Assets]
      summary: Activate asset
      description: Marks a validated asset as Active, integrating it into the live FlowSense system.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Asset activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Asset cannot be activated (unresolved validation errors)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /assets/{id}/versions/{version_id}/restore:
    post:
      tags: [Assets]
      summary: Restore asset version
      description: Makes a selected historical version the new active asset.
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/VersionIdPath"
      responses:
        "200":
          description: Asset version restored and activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetResponse"
        "404":
          $ref: "#/components/responses/NotFound"

