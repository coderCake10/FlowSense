      description: Retrieves daily operational metrics like queue usage or successful searches.
      parameters:
        - $ref: "#/components/parameters/AnalyticsDateRangeParam"
      responses:
        "200":
          description: Activity analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  /analytics/reports:
    get:
      tags: [Analytics]
      summary: List reports
      description: Retrieves a list of previously generated PDF or CSV analytics reports.
      responses:
        "200":
          description: List of reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
    post:
      tags: [Analytics]
      summary: Generate report
      description: Triggers Celery to generate or schedule a new data report based on selected analytics parameters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start_date, end_date, sections, format]
              properties:
                start_date:
                  type: string
                  format: date
                end_date:
                  type: string
                  format: date
                sections:
                  type: array
                  items:
                    type: string
                format:
                  type: string
                  enum: [pdf, csv]
                schedule:
                  type: object
                  properties:
                    frequency:
                      type: string
                      enum: [daily, weekly, monthly, semesterly]
                    day:
                      type: string
                    time:
                      type: string
      responses:
        "202":
          description: Report generation queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  /analytics/reports/{id}:
    get:
      tags: [Analytics]
      summary: Download report
      description: Downloads or retrieves a specific generated report file.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Report file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"

  /analytics/qr:
    get:
      tags: [Analytics]
      summary: Get QR handoff analytics
      description: Retrieves overall metrics on QR generation rates, scan rates, and handoffs over time.
      parameters:
        - $ref: "#/components/parameters/AnalyticsDateRangeParam"
      responses:
        "200":
          description: QR analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

  /analytics/qr/events:
    get:
      tags: [Analytics]
      summary: Get QR event log
      description: Retrieves logs of individual QR handoff occurrences.
      parameters:
        - $ref: "#/components/parameters/AnalyticsDateRangeParam"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: List of QR events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QrEventListResponse"

  # ------------------------------------------------------------------
  # ALERTS
  # ------------------------------------------------------------------
  /alerts:
    get:
      tags: [Alerts]
      summary: List alerts
      description: Retrieves current Informational, Warning, and Critical alerts requiring admin attention.
      parameters:
        - name: severity
          in: query
          schema:
            $ref: "#/components/schemas/AlertSeverity"
        - name: cleared
          in: query
          schema:
            type: boolean
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: List of alerts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertListResponse"

  /alerts/{id}:
    get:
      tags: [Alerts]
      summary: Get alert
      description: Retrieves details regarding a specific alert.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Alert detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /alerts/{id}/acknowledge:
    post:
      tags: [Alerts]
      summary: Acknowledge alert
      description: Logs that an administrator has seen an alert but it remains unresolved.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Alert acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /alerts/{id}/clear:
    post:
      tags: [Alerts]
      summary: Clear alert
      description: Administratively clears/resolves an alert, removing it from the dashboard panel.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Alert cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  # ------------------------------------------------------------------
  # ACTIVITY
  # ------------------------------------------------------------------
  /activity/:
    get:
      tags: [Activity]
      summary: List audit events
      description: Retrieves the system's audit trail detailing who changed what (assets, settings, annotations) and when.
      parameters:
        - name: event_type
          in: query
          schema:
            $ref: "#/components/schemas/AuditEventType"
        - name: admin_user_id
          in: query
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/StartDateParam"
        - $ref: "#/components/parameters/EndDateParam"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: List of audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventListResponse"

  /activity/{id}:
    get:
      tags: [Activity]
      summary: Get audit event
      description: Retrieves granular details about a specific audit event.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Audit event detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  # ------------------------------------------------------------------
  # USERS
  # ------------------------------------------------------------------
  /users:
    get:
      tags: [Users]
      summary: List administrators
      description: Retrieves a list of all registered administrators.
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
      responses:
        "200":
          description: List of administrators
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserListResponse"
    post:
      tags: [Users]
      summary: Register administrator
      description: Registers a new user with an Admin or Super Admin role. Restricted to Super Admins.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserInput"
      responses:
        "201":
          description: Administrator created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /users/{id}:
    get:
      tags: [Users]
      summary: Get administrator
      description: Retrieves details for a specific administrator profile.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Administrator detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Users]
      summary: Update administrator
      description: Updates an administrator's profile, such as changing their role or disabling their login.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserInput"
      responses:
        "200":
          description: Administrator updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Users]
      summary: Delete administrator
      description: Soft-deletes an administrator, revoking system access.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          $ref: "#/components/responses/SuccessNoData"
        "404":
          $ref: "#/components/responses/NotFound"

  # ------------------------------------------------------------------
  # SETTINGS
  # ------------------------------------------------------------------
  /settings:
    get:
      tags: [Settings]
      summary: List settings
      description: Retrieves all global configuration settings.
      responses:
        "200":
          description: List of settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingListResponse"

  /settings/{key}:
    get:
      tags: [Settings]
      summary: Get setting
      description: Retrieves the value of a specific setting key.
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Setting detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Settings]
      summary: Update setting
      description: Updates a specific setting key.
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: object
      responses:
        "200":
          description: Setting updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /settings/semesters:
    get:
      tags: [Settings]
      summary: List semesters
      description: Retrieves the registry of configured academic semesters.
      responses:
        "200":
          description: List of semesters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemesterListResponse"
    post:
      tags: [Settings]
      summary: Create semester
      description: Creates a new semester block with specific start and end dates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SemesterInput"
      responses:
        "201":
          description: Semester created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemesterResponse"

  /settings/semesters/{id}:
    get:
      tags: [Settings]
      summary: Get semester
      description: Retrieves configuration details for a specific academic semester.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Semester detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemesterResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Settings]
      summary: Update semester
      description: Modifies an existing semester's date range.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SemesterInput"
      responses:
        "200":
          description: Semester updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemesterResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Settings]
      summary: Delete semester
      description: Deletes a semester configuration from the registry.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          $ref: "#/components/responses/SuccessNoData"
        "404":
          $ref: "#/components/responses/NotFound"

  # ------------------------------------------------------------------
  # SYSTEM
  # ------------------------------------------------------------------
  /system/status:
    get:
      tags: [System]
      summary: Get system status
      description: Retrieves the overall system state (Operational, Degraded, Critical, or Maintenance) displayed on the admin dashboard.
      security: []
      responses:
        "200":
          description: System status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status:
                            $ref: "#/components/schemas/SystemStatus"

  /system/health:
    get:
      tags: [System]
      summary: Get system health
      description: Executes a health check to verify the operational status of sub-components like the Database, Redis, Celery, and Kiosks.
      security: []
      responses:
        "200":
          description: System health check results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"

components:
  securitySchemes:
    AdminSessionCookie:
      type: apiKey
      in: cookie
      name: flowsense_admin_session
      description: >
        Long-lived secure HTTP cookie established after passwordless
        administrator authentication. Required for all Admin API endpoints.
    KioskDeviceToken:
      type: http
      scheme: bearer
      description: >
        Short-lived kiosk access token obtained via device credential
        exchange. Used to distinguish an authenticated Kiosk Client from
        an ordinary browser on public endpoints.

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    VersionIdPath:
      name: version_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    UuidIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AreaIdFilter:
      name: area_id
      in: query
      schema:
        type: integer
        format: int64
    FloorIdFilter:
      name: floor_id
      in: query
      schema:
        type: integer
        format: int64
    AreaTypeFilter:
      name: area_type
      in: query
      schema:
        $ref: "#/components/schemas/AreaType"
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
    PageSizeParam:
      name: page_size
      in: query
      schema:
        type: integer
        default: 25
        minimum: 1
        maximum: 100
    StartDateParam:
      name: start_date
      in: query
      schema:
        type: string
        format: date-time
    EndDateParam:
      name: end_date
      in: query
      schema:
        type: string
        format: date-time
    AnalyticsDateRangeParam:
      name: range
      in: query
      description: Preset lookup range. Use start_date/end_date for custom range, or semester_id for semester scope.
      schema:
        type: string
        enum: [today, last_7_days, last_30_days, semester, custom]
        default: last_7_days

  responses:
    SuccessNoData:
      description: Operation completed successfully
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SuccessEnvelope"
    NotFound:
      description: The requested resource does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Missing or invalid authentication credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Authenticated but not permitted to perform this action
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ErrorResponse:
      description: Validation or business rule error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    CommandAccepted:
      description: Remote device command accepted and dispatched asynchronously
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SuccessEnvelope"

  schemas:
    # ---------------- Envelope ----------------
    SuccessEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          nullable: true
        message:
          type: string
          nullable: true
    ErrorEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              example: ROOM_NOT_FOUND
            message:
              type: string
              example: Destination does not exist.
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total_count:
          type: integer
        total_pages:
          type: integer

    # ---------------- Enums ----------------
    AreaType:
      type: string
      enum: [campus, building, outdoor, connector]
    RoomType:
      type: string
      enum: [room, office, laboratory, facility, service, restroom, hall, other]
    NodeType:
      type: string
      enum: [room, auxiliary, kiosk, sensor, area_entrance]
    EdgeDirection:
      type: string
      enum: [bidirectional, forward, reverse]
    TransitionType:
      type: string
      enum: [stairs, elevator, escalator, other]
    DeviceType:
      type: string
      enum: [kiosk, sensor]
    DeviceStatus:
      type: string
      enum: [unregistered, registered, online, offline, disabled, decommissioned]
    MqttStatus:
      type: string
      enum: [online, offline, unknown]
    NavigationSessionStatus:
      type: string
      enum: [created, active, scanned, completed, expired, cancelled]
    KioskSessionEndReason:
      type: string
      enum: [completed, idle_timeout, manual_exit, error, unknown]
    NavigationRequestStatus:
      type: string
      enum: [requested, generated, failed, completed]
    QrEventType:
      type: string
      enum: [generated, scanned, expired, invalid]
    AlertSeverity:
      type: string
      enum: [informational, warning, critical]
    AuditEventType:
      type: string
      enum: [asset, configuration, validation, administrative]
    AuditAction:
      type: string
      enum: [create, update, delete, upload, replace, restore, validate, activate, deactivate]
    AdminRole:
      type: string
      enum: [admin, super admin]
    ProcessingStatus:
      type: string
      enum: [pending, processing, completed, failed]
    ValidationResult:
      type: string
      enum: [passed, warning, failed]
    ValidationStatus:
      type: string
      enum: [passed, warning, error]
    ValidationCategory:
      type: string
      enum:
        - file_and_format
        - model_and_geometry
        - hierarchy_and_floor_structure
        - floors_and_spatial_configuration
        - flowsense_compatibility
    SystemStatus:
      type: string
      enum: [operational, degraded, critical, maintenance]

    # ---------------- Geometry ----------------
    GeoJSONGeometry:
      type: object
      description: GeoJSON geometry expressed in EPSG:3857, returned/accepted by the API as GeoJSON regardless of internal PostGIS storage.
      properties:
        type:
          type: string
          enum: [Point, LineString, Polygon, MultiPolygon, GeometryCollection]
        coordinates:
          type: array
          items: {}

    # ---------------- Campus: Area ----------------
    Area:
      type: object
      properties:
        id:
          type: integer
          format: int64
        parent_area_id:
          type: integer
          format: int64
          nullable: true
        code:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        area_type:
          $ref: "#/components/schemas/AreaType"
        geometry:
          $ref: "#/components/schemas/GeoJSONGeometry"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AreaInput:
      type: object
      required: [code, name, area_type]
      properties:
        parent_area_id:
          type: integer
          format: int64
          nullable: true
        code:
          type: string
        name:
          type: string
        description:
          type: string
        area_type:
          $ref: "#/components/schemas/AreaType"
        geometry:
          $ref: "#/components/schemas/GeoJSONGeometry"
    AreaResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/Area"
    AreaListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/Area"
            meta:
              $ref: "#/components/schemas/PaginationMeta"

    # ---------------- Campus: Floor ----------------
    Floor:
      type: object
      properties:
        id:
          type: integer
          format: int64
        area_id:
          type: integer
          format: int64
        glb_node_name:
          type: string
          nullable: true
        floor_order:
          type: integer
        elevation:
          type: number
          format: double
          nullable: true
        navigable:
          type: boolean
        visible_in_kiosk:
          type: boolean
        active:
          type: boolean
        geometry:
          $ref: "#/components/schemas/GeoJSONGeometry"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    FloorResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/Floor"
    FloorListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/Floor"

    # ---------------- Campus: Room ----------------
    Room:
      type: object
      properties:
        id:
          type: integer
          format: int64
        floor_id:
          type: integer
          format: int64
        room_code:
          type: string
        room_alias:
          type: string
        description:
          type: string
          nullable: true
        room_type:
          $ref: "#/components/schemas/RoomType"
        is_searchable:
          type: boolean
        is_navigable:
          type: boolean
        is_active:
          type: boolean
        geometry:
          $ref: "#/components/schemas/GeoJSONGeometry"
        image_path:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    RoomInput:
      type: object
      properties:
        room_code:
          type: string
        room_alias:
          type: string
        description:
          type: string
        room_type:
          $ref: "#/components/schemas/RoomType"
        is_searchable:
          type: boolean
        is_navigable:
          type: boolean
        is_active:
          type: boolean
        image_path:
          type: string
    RoomResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/Room"
    RoomListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/Room"
            meta:
              $ref: "#/components/schemas/PaginationMeta"

    # ---------------- Campus: Personnel ----------------
    Personnel:
      type: object
      properties:
        id:
          type: integer
          format: int64
        full_name:
          type: string
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        is_active:
          type: boolean
    PersonnelListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/Personnel"
            meta:
              $ref: "#/components/schemas/PaginationMeta"

    # ---------------- Campus: Entrance/Stairs/Elevator/Walkway ----------------
    Entrance:
      type: object
      properties:
        id:
          type: integer
          format: int64
        area_id:
          type: integer
          format: int64
        name:
          type: string
        entrance_type:
          type: string
          nullable: true
        is_primary:
          type: boolean
        active:
          type: boolean
        linked_node_id:
          type: integer
          format: int64
          nullable: true
        geometry:
          $ref: "#/components/schemas/GeoJSONGeometry"
    EntranceInput:
      type: object
      properties:
        name:
          type: string
        entrance_type:
          type: string
        is_primary:
          type: boolean
        active:
          type: boolean
        linked_node_id:
          type: integer
          format: int64
    EntranceResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/Entrance"
    EntranceListResponse:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
